- name: Setup TNMP Converter
  hosts: all
  become: true

  vars:
    checkpoints_directory: "/var/www/tnmp_converter/checkpoints"
    model_filename: "tnmp_generator.pt"
    docker_image: "sohaibkhiaf/tnmp_converter:latest"
    container_name: "tnmp_converter"

  tasks:

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create Docker keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create checkpoints directory
      ansible.builtin.file:
        path: "{{ checkpoints_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Upload model
      ansible.builtin.copy:
        src: "files/{{ model_filename }}"
        dest: "{{ checkpoints_directory }}/{{ model_filename }}"
        owner: root
        group: root
        mode: "0644"

    - name: Pull TNMP Converter image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Run TNMP Converter container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ docker_image }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "80:80"
        volumes:
          - "{{ checkpoints_directory }}:{{ checkpoints_directory }}"

